# Tooling config home for the Python side (ruff + mypy). Deps still live in the
# requirements-*.txt files consumed by setup.sh; this file is config-only for now.
# `bash check.sh` is the gate; it invokes ruff/mypy which read the sections below.

[tool.ruff]
line-length = 120          # generous; E501 is intentionally NOT enforced on the legacy module
target-version = "py312"   # the code uses PEP 701 f-strings (3.12+); runtime is 3.14
extend-exclude = [".venv", "tmp", "tools/skeleton_extractor/target"]

[tool.ruff.lint]
# Bug + idiom rule families. F=pyflakes, I=isort, UP=pyupgrade, C4=comprehensions,
# B=bugbear, SIM=simplify, plus high-signal individual E codes.
select = ["F", "I", "UP", "C4", "B", "SIM", "E711", "E714", "E741"]
ignore = [
    # B023 audited & fixed (R1.1b, 2026-06-10): loop vars bound as keyword-only
    # defaults at def time; the per-fn worker takes its level queue explicitly.
    # The rule now GATES so the capture class cannot recur.
    # SIM102 (collapsible nested if): stylistic; one site needs a risky reindent in the
    # untested engine. Tracked.
    "SIM102",
    # SIM115 audited & fixed (2026-06-10): monitor.py reads → context managers;
    # the one legitimate long-lived handle (model_interact stream log) carries a
    # justified noqa. The rule now GATES.
]

[tool.mypy]
# Baseline posture (matches the historical check.sh flags). pipeline_core is held to a
# stricter bar via the per-module override below.
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
strict_optional = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Enforce the clean-architecture dependency rule (CODE_ARCHITECTURE.md §1): a higher layer
# may import a lower one, never the reverse. domain is the floor (stdlib + the foundational
# log/retry/io facades only — those aren't layers so the contract doesn't govern them).
[tool.importlinter]
root_package = "pipeline_core"

[[tool.importlinter.contracts]]
name = "Layers: adapters > application > ports > domain"
type = "layers"
layers = [
    "pipeline_core.adapters",
    "pipeline_core.application",
    "pipeline_core.ports",
    "pipeline_core.domain",
]

[[tool.mypy.overrides]]
# The extracted package is new and clean — hold it to strict-optional (catches real
# Optional bugs). `disallow_untyped_defs` is deferred (backlog R1.3b): the verbatim-moved
# task bodies carry many trivial inner closures whose annotation is churn-without-bug-value;
# enable it after those are cleaned up.
module = "pipeline_core.*"
strict_optional = true
