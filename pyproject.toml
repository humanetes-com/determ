# Tooling config home for the Python side (ruff + mypy) AND the installable-package
# metadata (P8). The heavy backend deps (vllm/transformers) still install via setup.sh
# from the requirements-*.txt files; the `[project]` deps below are the minimal runtime
# floor so `pip install .` yields a working CLI + console scripts.
# `bash check.sh` is the gate; it invokes ruff/mypy which read the sections below.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "determ"
version = "0.1.0"
description = "Deterministic tests-only library reconstruction pipeline (self-hosted LLM)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "python-dotenv",
    "openai",        # OpenAI-compatible client for the self-hosted vLLM/SGLang endpoints
    "huggingface_hub",
]

[project.optional-dependencies]
dev = [
    "mypy==2.1.0",
    "ruff==0.15.15",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "pytest-xdist==3.8.0",
    "import-linter==2.5",
]

[project.scripts]
determ = "pipeline:main"
determ-monitor = "monitor:main"

[tool.setuptools]
py-modules = ["pipeline", "monitor", "model_interact"]

[tool.setuptools.packages.find]
include = ["pipeline_core*"]

[tool.ruff]
line-length = 120          # generous; E501 is intentionally NOT enforced on the legacy module
target-version = "py312"   # the code uses PEP 701 f-strings (3.12+); runtime is 3.14
extend-exclude = [".venv", "tmp", "tools/skeleton_extractor/target"]

[tool.ruff.lint]
# Bug + idiom rule families. F=pyflakes, I=isort, UP=pyupgrade, C4=comprehensions,
# B=bugbear, SIM=simplify, plus high-signal individual E codes.
select = ["F", "I", "UP", "C4", "B", "SIM", "E711", "E714", "E741"]
ignore = [
    # B023 audited & fixed (R1.1b, 2026-06-10): loop vars bound as keyword-only
    # defaults at def time; the per-fn worker takes its level queue explicitly.
    # The rule now GATES so the capture class cannot recur.
    # SIM102 (collapsible nested if): stylistic; one site needs a risky reindent in the
    # untested engine. Tracked.
    "SIM102",
    # SIM115 audited & fixed (2026-06-10): monitor.py reads → context managers;
    # the one legitimate long-lived handle (model_interact stream log) carries a
    # justified noqa. The rule now GATES.
]

[tool.mypy]
# Baseline posture (matches the historical check.sh flags). pipeline_core is held to a
# stricter bar via the per-module override below.
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true  # global-only flag; catches no-op casts everywhere
strict_optional = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    # A walk replays a recorded pathological run through the real control loop
    # with cargo and the model stubbed, and asserts on the DECISION a fix was
    # meant to make reachable — not on the pass count, which a fixed observation
    # sequence cannot honestly predict past the first divergent iteration.
    # `pre_run.sh` runs these as its own stage so their verdict reads separately
    # from "is the code correct"; the default pytest run still includes them, so
    # the coverage they carry stays counted.
    "walk: replays a recorded run's iterations through the real loop",
    # An integration test drives the real adapters (cargo, the syn extractor,
    # the file readers) over an invented shape that reproduces one defect
    # class, with no model. Cargo-backed ones skip unless INTEGRATION=1;
    # `scripts/run_integration.sh` runs the whole set.
    "integration: real adapters over an invented shape reproducing one defect class",
]

# Enforce the clean-architecture dependency rule (CODE_ARCHITECTURE.md §1): a higher layer
# may import a lower one, never the reverse. domain is the floor (stdlib + the foundational
# log/retry/io facades only — those aren't layers so the contract doesn't govern them).
[tool.importlinter]
root_package = "pipeline_core"

[[tool.importlinter.contracts]]
# `pipeline_core/monitor/` is the standalone observer's library (monitor.py is
# its only importer). `code_identity` (domain/measurement.py) EXCLUDES it from
# the resume-invalidation identity on exactly that premise — an observer-only
# edit must not discard the TDD floor's cursor and futility evidence (run
# `3097970-03bcf403`, 2026-08-18, cost one ~68-minute relaunch cycle). This
# contract is what keeps the premise true: composing the observer into the
# pipeline would silently turn that exclusion into a lie. `pipeline.py`
# itself cannot be a root here (grimp rejects single-file modules), so its
# half of the premise is pinned by AST in `tests/test_measurement_identity.py`.
name = "The observer library is not composed into the pipeline"
type = "forbidden"
source_modules = [
    "pipeline_core.adapters",
    "pipeline_core.application",
    "pipeline_core.prompts",
    "pipeline_core.ports",
    "pipeline_core.domain",
]
forbidden_modules = ["pipeline_core.monitor"]

[[tool.importlinter.contracts]]
name = "Layers: adapters > application > prompts > ports > domain"
type = "layers"
layers = [
    "pipeline_core.adapters",
    "pipeline_core.application",
    "pipeline_core.prompts",
    "pipeline_core.ports",
    "pipeline_core.domain",
]

[[tool.mypy.overrides]]
# The extracted package is new and clean — held to the FULL strict flag set.
# `strict = true` isn't valid in a per-module override, so the flags are
# enumerated. This is the complete `--strict` set for the package.
module = "pipeline_core.*"
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
no_implicit_reexport = true  # every cross-module name must be an explicit re-export;
                             # pipeline.py imports only names the package genuinely
                             # defines or re-exports.
warn_unreachable = true  # beyond strict: dead branches (e.g. impossible isinstance) are bugs

[[tool.mypy.overrides]]
# The OPTIONAL backends are typed as Any for everyone, whether or not the box
# they run on has them installed.
#
# Why: mypy's answer for these modules otherwise depends on what happens to be in
# site-packages, and `warn_unused_ignores` (above) turns that into a hard error on
# one machine and silence on another. On 2026-08-15 the GitHub push failed the
# `mypy` step alone: CI installs `requirements-base.txt` (openai, python-dotenv,
# huggingface_hub) and nothing else, so `transformers` was missing there,
# `BitsAndBytesConfig(...)` in adapters/llm_transports.py was a call on Any, and
# the `# type: ignore[no-untyped-call]` the local venv needs became an unused
# ignore. `bash check.sh` was green on the same commit — the local venv carries
# torch and transformers for the HF transport, so the ignore was live there.
#
# `follow_imports = "skip"` (not just `ignore_missing_imports`) is what makes the
# two environments agree: an INSTALLED module is skipped too, so the types are
# identical either way. The cost is deliberate — no type checking of our calls
# into torch/transformers/ollama/grep_ast. Installing them in CI is the other
# way to close the gap and it costs a multi-gigabyte torch download per run.
#
# `gdb` is the debugger's embedded module: it exists only inside a gdb process
# and is never installable, so it is Any everywhere by construction.
module = ["torch.*", "transformers.*", "ollama.*", "grep_ast.*", "gdb"]
ignore_missing_imports = true
follow_imports = "skip"
