[semver]
ssh_url = git@github.com:dtolnay/semver.git
fit = best
assessment = Best fit. Its tests are many and small, located in a dedicated tests directory, and require no external fixtures. Includes std/no_std feature worlds that exercise cfg-world handling, and the small codebase keeps wall time reasonable. Note: Contains an unsafe identifier file, which tests whether unsafe handling generalizes, though it makes semver slightly less purely safe.

[url]
ssh_url = git@github.com:servo/rust-url.git
fit = challenging
assessment = The strongest test of the theory, but a poor first run. It is a multi-crate workspace (idna, percent-encoding), and its major conformance test loops over a JSON file, giving coarse verdicts where a single red test can hide thousands of cases.

[pulldown-cmark]
ssh_url = git@github.com:pulldown-cmark/pulldown-cmark.git
fit = skip
assessment = Spec tests come from a build script and the crate is large; skip for initial reconstruction.

[calamine]
ssh_url = git@github.com:tauri-apps/calamine.git
fit = skip
assessment = Requires real spreadsheet fixtures as well as zip and xml dependencies, introducing harness questions unrelated to reconstruction; skip.

[roaring-rs]
ssh_url = git@github.com:RoaringBitmap/roaring-rs.git
fit = second
assessment = A decent second choice. However, its proptest and quickcheck suites rely on randomized inputs, meaning an oracle tracking deterministic execution under identical cfg environments could see noise.
