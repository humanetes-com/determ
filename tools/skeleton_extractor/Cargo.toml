[package]
name = "skeleton-extractor"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "skeleton-extractor"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
walkdir = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prettyplease = "0.2"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
