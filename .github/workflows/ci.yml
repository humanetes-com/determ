name: CI

# Mirrors the local `bash check.sh` (Python) + the Rust crate gates, so a PR sees the
# same quality bar a contributor sees locally. Config lives in pyproject.toml (ruff/mypy)
# and tools/skeleton_extractor (clippy/fmt) — this file just runs the gates.

on:
  push:
    branches: [master, pipeline]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      # v5/v6 are the Node-24 releases: GitHub's runners now force Node-20 actions
      # onto Node 24 anyway and print a deprecation notice on every job.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"   # code requires 3.12+ (PEP 701 f-strings)
      - name: Install tools + runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.15 mypy==2.1.0 pytest==8.4.2 pytest-cov==7.0.0 import-linter==2.5
          pip install -r requirements-base.txt
      - name: ruff (lint — pyproject config)
        run: ruff check pipeline.py monitor.py model_interact.py pipeline_core tools tests
      - name: mypy (types — pyproject config; pipeline_core strict-optional)
        run: mypy pipeline.py monitor.py model_interact.py pipeline_core
      - name: import-linter (architecture layers)
        run: lint-imports --config pyproject.toml
      - name: extraction invariants
        run: python tools/check_extraction_invariants.py
      # pytest needs the extractor binary, not just the Rust gates in the job below.
      # 35 tests locate a fn through the syn record — the whole same-name splice
      # collision class (`fn not` x3, `fn from` x6, `fn fmt` x8) plus the file-first
      # and impl-block fill loops. `splice_body_scoped` falls back to the bare-name
      # path when the record locator returns nothing, and the bare-name path refuses
      # `ambiguous_name` by design, so without the binary those tests do not skip —
      # they FAIL. They are 35 of the 38 failures in the 2026-08-15 run, reproduced
      # by running the suite against a bare `git archive HEAD` checkout and cleared
      # by staging the binary into it. Only test_pipeline_smoke.py carried the
      # `needs_extractor` guard. Same pin as the rust job: the two toolchain
      # versions move together. 17.6s cold on the dev box with a warm crate
      # registry; CI pays the crate downloads on top.
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: build skeleton-extractor (pytest dependency)
        run: cargo build --release --manifest-path tools/skeleton_extractor/Cargo.toml
      - name: pytest + domain coverage floor
        run: pytest --cov=pipeline_core.domain --cov-report=term-missing:skip-covered --cov-fail-under=95

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/skeleton_extractor
    steps:
      - uses: actions/checkout@v5
      # PINNED, not `@stable`. `@stable` moved from 1.95.0 to 1.97.0 on 2026-07-07
      # and the new `question_mark` lint failed a push against code no local gate
      # could flag, since this project's box is on 1.95.0. check.sh runs the same
      # gates under RUST_GATE_TOOLCHAIN, defaulted to the version below — move the
      # two together.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: doc (deny broken links)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
